qq_jrrp:
  panel_description: 'Show daily fortune and a quote'
  sentence: |-
    {text}

    — {source}
  submission_template: |-
    /jrrp post '''
    Replace this with your quote; multiple lines are allowed
    '''
    Author / source
  submission_quotation: |-
    > /jrrp post '''
    > Replace this with your quote; multiple lines are allowed
    > '''
    > Author / source
  submission: |-
    # Submit a quote

    Click “Submit” to insert the full template, replace the text and source, then send it.

    {template}

    Triple-quote markers occupy their own lines (the opening marker follows the command). Internal whitespace is preserved. Both quote and source must be non-empty.
  help: |-
    # Daily fortune · Help

    - **/jrrp**: Show today's luck score and a quote.
    - **/jrrp post**: Show the submission format, or click “Submit” to insert a template.
    - **/jrrp withdraw <id>**: Withdraw a specific submission. Only its author or a user with permission level 2 or higher may do so.
    - **/jrrp help**: Show this help.

    The score stays fixed throughout the local day and is just for fun. While the quote pool stays unchanged, there are at most three daily quote choices.
  empty: 'The quote pool is empty. Click “Submit” to share a quote.'
  fortune: |-
    # Daily fortune · {title}

    **Luck score: {score}%**

    *{description}*

    {date} · Just for fun

    ## Today's quote

    {quotation}
  date: '{year:04d}-{month:02d}-{day:02d}'
  post_invalid: |-
    # Invalid submission

    Both text and source must be non-empty.

    {instructions}
  post_success: |-
    # Quote submitted

    {quotation}
  withdraw_missing: |-
    # Withdrawal failed

    The submission does not exist or has already been withdrawn.
  withdraw_success: |-
    # Quote withdrawn

    {quotation}
  withdraw_usage: |-
    # Withdraw a submission

    Click “Withdraw” in the successful submission message, or send /jrrp withdraw <id>.
  withdraw_denied: |-
    # Withdrawal denied

    Only the author or a user with permission level 2 or higher may withdraw this submission.
  storage_error: |-
    # Quote storage failed

    Please ask an administrator to check the data file and directory permissions.
  buttons:
    fortune: 'Fortune'
    help: 'Help'
    submit: 'Submit'
    withdraw: 'Withdraw'
    unsupported: 'Please update QQ or send /jrrp help manually.'
  categories:
    great_luck:
      title: 'Great luck'
      description: 'Everything is going your way ~'
    luck:
      title: 'Luck'
      description: 'Today is a lucky day!'
    small_luck:
      title: 'Small luck'
      description: 'Daily little luck (1/1)'
    small_misfortune:
      title: 'Small misfortune'
      description: 'Maybe a small problem?'
    misfortune:
      title: 'Misfortune'
      description: 'Well… probably fine (?)'
    great_misfortune:
      title: 'Great misfortune'
      description: 'Time to run away!'
